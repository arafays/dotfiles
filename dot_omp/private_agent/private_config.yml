theme:
  dark: dark-gruvbox
setupVersion: 1
# modelRoles: 
#   default: opencode-go/deepseek-v4-pro:max
#   smol: opencode-go/mimo-v2.5
#   commit: opencode-go/deepseek-v4-flash
#   tiny: opencode-zen/mimo-v2.5-free
#   vision: opencode-go/mimo-v2.5
#   plan: opencode-go/deepseek-v4-pro:high
