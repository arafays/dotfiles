bind r source-file ~/.tmux.conf \; display "Reloaded!" # quick reload

set -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g automatic-rename on

set-window-option -g set-titles on
set-option -g allow-rename off

set -g pane-base-index 1
set -g default-shell /usr/bin/fish
set -g display-time 750
set -g history-limit 2000
set -g mouse on
set -g prefix C-b

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Intuitive splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Copy mode improvements
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-keys vi
set -g update-environment[0] DISPLAY
set -g update-environment[1] KRB5CCNAME
set -g update-environment[2] SSH_ASKPASS
set -g update-environment[3] SSH_AUTH_SOCK
set -g update-environment[4] SSH_AGENT_PID
set -g update-environment[5] SSH_CONNECTION
set -g update-environment[6] WINDOWID
set -g update-environment[7] XAUTHORITY

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,alacritty:RGB"

set -g extended-keys on
set -g extended-keys-format csi-u

set-option -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'vaaleyard/tmux-dotbar'

set -g @tmux-dotbar-position "top"

set -g @tmux-dotbar-bg "#101010"
set -g @tmux-dotbar-fg "#7e7e7e"
set -g @tmux-dotbar-fg-current "#ffffff"
set -g @tmux-dotbar-fg-session "#ffc799"
set -g @tmux-dotbar-fg-prefix "#f5a191"

set -g @resurrect-capture-pane-contents 'v2'
set -g @resurrect-strategy-v2 'start'

set-option -a terminal-features 'xterm-256color:RGB'

# Enable pass-through for image previews and better clipboard
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

run '/usr/share/tmux-plugin-manager/tpm'
