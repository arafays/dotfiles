# black = "#161616"
# red = "#ee5396"
# green = "#42be65"
# yellow = "#ffe97b"
# blue = "#33b1ff"
# magenta = "#be95ff"
# cyan = "#3ddbd9"
# white = "#dde1e6"
#
# [colors.bright]
# black = "#262626"
# red = "#ee5396"
# green = "#42be65"
# yellow = "#ffe97b"
# blue = "#78a9ff"
# magenta = "#be95ff"
# cyan = "#3ddbd9"
# white = "#ffffff"

[font]
size = 12

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[keyboard]
[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\f"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[general]
live_config_reload = true
