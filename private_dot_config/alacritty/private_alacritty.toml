[env]
TERM = "alacritty"

[window]
decorations = "none"
dynamic_title = true
opacity = 0.8
title = "Alacritty"
blur = true

[terminal.shell]
program = "/usr/bin/fish"

[font]
size = 12

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[keyboard]
[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\f"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]
live_config_reload = true
