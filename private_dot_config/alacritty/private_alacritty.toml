[env]
TERM = "alacritty"

[window]
decorations = "none"
dynamic_title = true
opacity = 0.8
title = "Alacritty"
blur = true

[terminal.shell]
program = "/usr/bin/fish"

# # Colors (Oxocarbon theme to match Starship)
# [colors.primary]
# background = "#161616"
# foreground = "#dde1e6"
#
# [colors.cursor]
# text = "#161616"
# cursor = "#dde1e6"
#
