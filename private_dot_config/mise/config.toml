[tools]
# Development runtimes: update deliberately with `mise run update:runtimes`.
# System Node/Python/Java and native libraries remain owned by pacman.
node = "lts"
bun = "latest"
go = "latest"
rust = "latest"

# User CLI tools: the bootstrap tool-update service checks these daily.
aube = { version = "latest", auto_update = true }
usage = { version = "latest", auto_update = true }
rtk = { version = "latest", auto_update = true }
uv = { version = "latest", auto_update = true }
"cargo:kdlfmt" = { version = "latest", auto_update = true }
shellcheck = { version = "latest", auto_update = true }
shfmt = { version = "latest", auto_update = true }
playwright = { version = "latest", auto_update = true }
# Any-format -> Markdown converter (pdf/docx/xlsx/pptx/html/...) plus its MCP server.
"pypi:markitdown" = { version = "latest", extras = ["all"], auto_update = true }
"pypi:markitdown-mcp" = "0.0.1a7" # pinned: only alpha releases, `latest` does not resolve them

# Shared editor tools. Neovim itself is pacman-owned; npm:neovim is its provider.
"npm:neovim" = { version = "latest", auto_update = true }
# TypeScript servers/compiler stay in Mason with LazyVim's TypeScript extras.
biome = { version = "latest", auto_update = true }
"npm:prettier" = { version = "latest", auto_update = true }
"npm:markdownlint-cli2" = { version = "latest", auto_update = true }
"npm:vim-language-server" = { version = "latest", auto_update = true }
"npm:yaml-language-server" = { version = "latest", auto_update = true }

"npm:tripo-cli" = "latest"

"github:dmtrKovalenko/bashka" = { version = "latest", auto_update = true }
"npm:@opencode-ai/browser-control" = { version = "latest", auto_update = true }
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = ["undici"] }
"npm:cf" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
# Warn about native requirements; background tool updates must never invoke sudo.
system_deps = "warn"

[settings.self_update]
auto = true

[tasks.bootstrap]
description = "Verify the development setup after packages and tools are installed"
run = "mise run doctor:dev"

[tasks."doctor:dev"]
description = "Inspect mise, bootstrap resources, and installer-managed tools"
run = ["mise doctor", "mise bootstrap status", "bashka list"]

[tasks."update:tools"]
description = "Update configured CLI/editor tools, preserving runtime versions and config"
run = "mise upgrade --exclude node --exclude bun --exclude go --exclude java --exclude rust"

[tasks."update:runtimes"]
description = "Manually update development runtimes within their configured version ranges"
run = "mise upgrade node bun go java rust"

[tasks."update:extensions"]
description = "Update extensions explicitly"
run = "codex update"

[tasks."clean:preview"]
description = "Preview unused mise versions without removing anything"
run = "mise prune --dry-run"

[tasks.update-daily]
description = "Update CLI/editor tools and Pi extensions (runtime updates remain manual)"
depends = ["update:tools"]
run = "mise run update:extensions"
