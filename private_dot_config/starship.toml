"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 100
add_newline = true
format = """
[╭](fg:separator) 󰣇 $directory$all$line_break\
[╰](fg:separator) $character
"""

[directory]
read_only = " 󰌾"
truncation_length = 3

[git_branch]
symbol = " "

[git_status]
stashed = ' [ ${count}](blue)'
modified = ' [ ${count}](yellow)'
ahead = ' [ ${count}](green)'
diverged = ' [ ⇡${ahead_count}(green) ⇣${behind_count}(red)](bold purple)'
behind = ' [ ${count}](red)'
staged = ' [ ${count}](green)'
untracked = ' [ ${count}](red)'

[git_commit]
tag_symbol = '  '

[aws]
symbol = " "

